[package]
name = "proteus"
version = "0.3.0"
description = "PROTEUS persona laboratory"
edition = "2021"
rust-version = "1.99"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
cmake = "0.1"
openssl-src = "300"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
url = "2"
percent-encoding = "2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"], optional = true }

[dev-dependencies]
quircs = "0.10.3"

[features]
default = ["telegram"]
telegram = ["dep:qrcode"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
