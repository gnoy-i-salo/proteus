name: CI
on:
  push:
    branches: [trunk, 'codex/**']
  pull_request:
    branches: [trunk]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Validate commit messages
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          else
            git log -1 --format=%B "$HEAD_SHA" | pnpm exec commitlint --verbose
          fi
      - run: pnpm test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  native:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        # Use the Intel pool; release.yml retains both macOS release targets.
        os: [macos-26-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Run 42620554231 passed Intel Rust tests but timed out during native packaging at 180 min.
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Linux webview prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev cmake gperf zlib1g-dev perl nasm
      - name: macOS TDLib prerequisites
        if: runner.os == 'macOS'
        run: brew install cmake gperf nasm
      - name: Windows TDLib prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows-static-md gperf:x64-windows
          if ($LASTEXITCODE -ne 0) { throw 'TDLib dependencies failed to build' }
          "PROTEUS_ZLIB_ROOT=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/tools/gperf" >> $env:GITHUB_PATH
          "$env:ProgramFiles/NASM" >> $env:GITHUB_PATH
      - name: Verify pinned TDLib source
        run: pnpm prepare:tdlib
      - name: Verify pinned local tokenizer
        run: pnpm prepare:models
      - name: Verify pinned CPU model for native inference tests
        run: pnpm prepare:embedding-model
      - run: pnpm build
      - run: pnpm check:rust
      - run: pnpm build:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: proteus-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/proteus
            apps/desktop/src-tauri/target/release/proteus.exe
          if-no-files-found: error
          retention-days: 14
  pages-build:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:pages
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/trunk' && github.event_name != 'pull_request'
        with:
          path: .cache/pages
  pages-deploy:
    needs: [quality, native, pages-build]
    if: github.ref == 'refs/heads/trunk' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@v4
