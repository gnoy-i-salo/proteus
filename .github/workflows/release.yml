name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (e.g. v0.1.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mjs
      - run: pnpm check
      - run: pnpm test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: release-browser-report
          path: test-results/
          retention-days: 7
  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            bundles: app,dmg
            extension: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x64
            bundles: app,dmg
            extension: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bundles: nsis
            extension: exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            bundles: deb
            extension: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup target add ${{ matrix.target }}
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: pnpm build
      - run: pnpm check:rust
      - name: Build installer
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm --filter @proteus-int/desktop tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect installer
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          EXTENSION: ${{ matrix.extension }}
        run: node scripts/release.mjs collect
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - run: node scripts/release.mjs checksums
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/is-draft; then
            if [ "$(cat /tmp/is-draft)" = false ]; then
              echo 'Release already published; keeping its assets unchanged.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "PROTEUS $RELEASE_TAG" --generate-notes --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
