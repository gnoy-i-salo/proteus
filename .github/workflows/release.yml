name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (e.g. v0.1.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  quality:
    outputs:
      sourceSha: ${{ steps.source.outputs.sourceSha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - id: source
        run: node scripts/release.mjs source
      - run: pnpm check
      - run: pnpm build:pages
      - run: pnpm test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: release-browser-report
          path: test-results/
          retention-days: 7
  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            bundles: app,dmg
            extension: dmg
          - os: macos-26-intel
            target: x86_64-apple-darwin
            platform: macos-x64
            bundles: app,dmg
            extension: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bundles: nsis
            extension: exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            bundles: deb
            extension: deb
    runs-on: ${{ matrix.os }}
    # Cold Intel verification plus TDLib packaging exceeded 180 min in run 42620554231.
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: 2
      SOURCE_SHA: ${{ needs.quality.outputs.sourceSha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.quality.outputs.sourceSha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev cmake gperf zlib1g-dev perl nasm
      - name: macOS TDLib prerequisites
        if: runner.os == 'macOS'
        run: brew install cmake gperf nasm
      - name: Windows TDLib prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows-static-md gperf:x64-windows
          if ($LASTEXITCODE -ne 0) { throw 'TDLib dependencies failed to build' }
          "PROTEUS_ZLIB_ROOT=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/tools/gperf" >> $env:GITHUB_PATH
          "$env:ProgramFiles/NASM" >> $env:GITHUB_PATH
      - name: Verify pinned TDLib source
        run: pnpm prepare:tdlib
      - name: Verify pinned local tokenizer
        run: pnpm prepare:models
      - name: Verify pinned CPU model for native inference tests
        run: pnpm prepare:embedding-model
      - run: pnpm build
      - run: pnpm check:rust
      - name: Build installer
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm --filter @proteus-int/desktop tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect installer
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          EXTENSION: ${{ matrix.extension }}
        run: node scripts/release.mjs collect
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [quality, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ needs.quality.outputs.sourceSha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.quality.outputs.sourceSha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - run: node scripts/release.mjs checksums
      - name: Assemble verified release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/is-draft; then
            if [ "$(cat /tmp/is-draft)" != true ]; then
              echo 'Release is not a draft; keeping its assets unchanged and stopping.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "PROTEUS $RELEASE_TAG" --generate-notes --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.dmg release-assets/*.exe release-assets/*.deb release-assets/SHA256SUMS.txt release-assets/BUILD-MANIFEST.json --clobber
      - name: Verify uploaded draft bytes and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --dir "$verify_dir"
          cmp release-assets/SHA256SUMS.txt "$verify_dir/SHA256SUMS.txt"
          cmp release-assets/BUILD-MANIFEST.json "$verify_dir/BUILD-MANIFEST.json"
          (cd "$verify_dir" && sha256sum --check --strict SHA256SUMS.txt)
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse --verify 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
